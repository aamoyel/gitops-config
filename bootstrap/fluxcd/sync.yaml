apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 5m
  path: ./bootstrap/fluxcd/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitops-config
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  path: ./bootstrap/fluxcd/instances
  prune: true
  sourceRef:
    kind: GitRepository
    name: gitops-config
  dependsOn:
    - flux-operator
